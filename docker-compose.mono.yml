# Every module in one container. Postgres holds one database per module; Redis carries the events.
# Development values only: in production, set real secrets.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
  APP_URL: "http://localhost:8000"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_DATABASE: modulith
  DB_USERNAME: modulith
  DB_PASSWORD: modulith
  DB_APP_USERNAME: modulith_app
  DB_APP_PASSWORD: modulith_app
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis
  AUTH_TOKEN_VALIDATION_STRATEGY: rpc   # jwt needs AUTH_JWT_PUBLIC_KEY / AUTH_JWT_PRIVATE_KEY

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        modulith: ../modular-monolith
    image: modulith-skeleton:mono
    environment:
      <<: *env
      MODULITH_RUNS: "*"
      WITH_CONSUMERS: "iam,analytics,notifications"
      WITH_SCHEDULER: "true"
      SYNC_PERMISSIONS: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build: ./docker/postgres
    image: modulith-postgres:local
    environment:
      POSTGRES_DB: modulith
      POSTGRES_USER: modulith
      POSTGRES_PASSWORD: modulith
      DB_APP_PASSWORD: modulith_app
      MODULE_DATABASES: "iam analytics notifications"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "modulith"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
